<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other News — PTT NGR</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===== JSON-DRIVEN CONTENT ===== */
.page-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr); gap:36px; align-items:start; margin-top:32px; }
.latest-card { border:1px solid #d8dce5; background:#fff; padding:16px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:28px; align-items:center; }
.latest-image { width:100%; aspect-ratio:1/1; overflow:hidden; background:#eef1f5; }
.latest-image img { width:100%; height:100%; object-fit:cover; display:block; }
.latest-copy time,.previous-copy time { display:block; color:#2f6f9f; font-size:.84rem; font-weight:700; letter-spacing:.04em; margin-bottom:10px; }
.latest-copy h3 { margin:0 0 16px; font-size:clamp(1.6rem,2.5vw,2.4rem); line-height:1.12; }
.latest-copy p { margin:0 0 20px; line-height:1.7; white-space:pre-line; }
.read-more { display:inline-block; padding:12px 20px; border:1px solid #30386b; color:#30386b; text-decoration:none; font-weight:700; letter-spacing:.06em; font-size:.8rem; }
.read-more:hover { background:#30386b; color:#fff; }
.previous-sidebar { border:1px solid #d8dce5; background:#fff; padding:22px; }
.previous-sidebar h3 { margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid #30386b; font-size:1.1rem; letter-spacing:.08em; text-transform:uppercase; }
.previous-list { display:flex; flex-direction:column; }
.previous-item { display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid #e3e6ec; text-decoration:none; color:inherit; cursor:pointer; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; font:inherit; }
.previous-item:first-child { padding-top:10px; }
.previous-item img { width:110px; aspect-ratio:1/1; object-fit:cover; display:block; background:#eef1f5; }
.previous-copy span { display:block; font-size:.96rem; line-height:1.42; font-weight:600; }
.previous-item b { font-size:1.8rem; line-height:1; font-weight:400; color:#6f7484; }
.previous-item:hover .previous-copy span { color:#2f6f9f; }
.empty-state { border:1px dashed #c9ced8; padding:28px; color:#6f7484; background:#fff; }
.loading { color:#6f7484; }
@media(max-width:900px){.page-grid{grid-template-columns:1fr;}}
@media(max-width:620px){.latest-card{grid-template-columns:1fr;gap:20px}.previous-item{grid-template-columns:88px minmax(0,1fr) auto}.previous-item img{width:88px;}}

</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="PTT NGR Main">
    <img class="logo" src="assets/PTT NGR color_0.png" alt="PTT NGR logo">
  </a>

  <div class="header-right">
    <img class="anniversary-logo" src="assets/PTT_40_years.png" alt="PTT 40 years NGR Natural Gas Retail">
    <div class="brand">
      <h1>PTT NGR</h1>
      <p>Knowledge &amp; Information Portal</p>
    </div>
  </div>
</header>

<nav class="nav" aria-label="Main navigation">
  <a href="index.html">MAIN</a>
  <a href="global-energy-prices.html">GLOBAL ENERGY PRICES</a>
  <a href="godji-content.html">GODJI CONTENT</a>
  <a href="other-news.html" class="active">OTHER NEWS</a>
</nav>

<main>
  <div class="eyebrow">SECTION</div>
  <h2>Other News</h2>
  <p class="intro">A dedicated page for selected news and information outside the other sections.</p>

  <div class="page-grid">
    <section class="latest-content" aria-label="Latest content">
      <div id="latest-content" class="loading">Loading content…</div>
    </section>

    <aside class="previous-sidebar" aria-label="Previous Content">
      <h3>Previous Content</h3>
      <div id="previous-content" class="previous-list loading">Loading content…</div>
    </aside>
  </div>
</main>
<script>
const DATA_FILE = "data/other-news.json";
let allItems = [];

function safeText(value) { return value == null ? "" : String(value); }

function renderLatest(item) {
  const container = document.getElementById('latest-content');
  if (!item) {
    container.innerHTML = '<div class="empty-state">No content has been added yet.</div>';
    return;
  }
  container.innerHTML = `
    <article class="latest-card">
      <div class="latest-image">
        <img src="${safeText(item.image)}" alt="${safeText(item.headline)}">
      </div>
      <div class="latest-copy">
        <time datetime="${safeText(item.date)}">${safeText(item.date)}</time>
        <h3></h3>
        <p></p>
        <a class="read-more">READ MORE →</a>
      </div>
    </article>`;
  container.querySelector('h3').textContent = safeText(item.headline);
  container.querySelector('p').textContent = safeText(item.description);
  const button = container.querySelector('.read-more');
  if (item.link && item.link.trim()) {
    button.href = item.link;
    if (/^https?:\/\//i.test(item.link)) button.target = '_blank';
  } else {
    button.href = '#';
    button.textContent = 'CURRENT CONTENT';
    button.addEventListener('click', e => e.preventDefault());
  }
}

function renderPrevious(items) {
  const container = document.getElementById('previous-content');
  container.innerHTML = '';
  if (!items.length) {
    container.innerHTML = '<div class="empty-state">No previous content yet.</div>';
    return;
  }
  items.forEach(item => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'previous-item';
    button.innerHTML = `
      <img src="${safeText(item.image)}" alt="">
      <div class="previous-copy"><time datetime="${safeText(item.date)}">${safeText(item.date)}</time><span></span></div>
      <b aria-hidden="true">›</b>`;
    button.querySelector('span').textContent = safeText(item.headline);
    button.addEventListener('click', () => {
      renderLatest(item);
      window.location.hash = item.id || item.date;
      document.getElementById('latest-content').scrollIntoView({behavior:'smooth', block:'start'});
    });
    container.appendChild(button);
  });
}

async function loadContent() {
  try {
    const response = await fetch(DATA_FILE + '?v=' + Date.now());
    if (!response.ok) throw new Error('Could not load ' + DATA_FILE);
    const data = await response.json();
    allItems = Array.isArray(data.items) ? data.items : [];
    const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
    const selected = hash ? allItems.find(item => item.id === hash || item.date === hash) : null;
    renderLatest(selected || allItems[0]);
    const latestId = (selected || allItems[0])?.id;
    renderPrevious(allItems.filter((item,index) => index !== 0 && item.id !== latestId));
  } catch (error) {
    document.getElementById('latest-content').innerHTML = '<div class="empty-state">Content could not be loaded. Please check the JSON file path.</div>';
    document.getElementById('previous-content').innerHTML = '';
    console.error(error);
  }
}

window.addEventListener('hashchange', loadContent);
loadContent();
</script>
</body>
</html>
