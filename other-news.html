<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Other News — PTT NGR</title>
<link rel="stylesheet" href="style.css">
<style>

/* ===== CONTENT LAYOUT ===== */
.page-grid{
  display:grid;
  grid-template-columns:minmax(0, 2.25fr) minmax(300px, .75fr);
  gap:32px;
  align-items:start;
  margin-top:28px;
}

.latest-content{
  min-width:0;
}

.latest-card{
  border:1px solid #d8dce5;
  background:#fff;
  padding:18px;
  display:grid;
  grid-template-columns:minmax(280px, 42%) minmax(0, 1fr);
  gap:30px;
  align-items:start;
}

.latest-image{
  width:100%;
  overflow:hidden;
  background:#eef1f5;
  align-self:start;
}

.latest-image img{
  width:100%;
  height:auto;
  object-fit:contain;
  display:block;
}

/* Image-only content: keep the portrait image centered and flush to the top. */
.latest-card.image-only{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px;
}

.latest-card.image-only .latest-image{
  width:min(100%, 620px);
  margin:0 auto;
}

.latest-copy{
  min-width:0;
  font-size:.94rem;
}

.latest-copy time,
.previous-copy time{
  display:block;
  color:#2f6f9f;
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.04em;
  margin-bottom:8px;
}

.latest-copy h3{
  margin:0 0 12px;
  font-size:clamp(1.45rem, 2vw, 2.05rem);
  line-height:1.18;
}

.content-paragraphs p{
  margin:0 0 14px;
  line-height:1.68;
  font-size:.94rem;
  color:#344054;
}

.content-paragraphs p:last-child{
  margin-bottom:18px;
}

.read-more{
  display:inline-block;
  padding:10px 16px;
  border:1px solid #30386b;
  color:#30386b;
  text-decoration:none;
  font-weight:700;
  letter-spacing:.06em;
  font-size:.72rem;
}

.read-more:hover{
  background:#30386b;
  color:#fff;
}

.previous-sidebar{
  border:1px solid #d8dce5;
  background:#fff;
  padding:20px;
}

.previous-sidebar h3{
  margin:0 0 10px;
  padding-bottom:9px;
  border-bottom:1px solid #30386b;
  font-size:1rem;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.previous-list{
  display:flex;
  flex-direction:column;
}

.previous-item{
  display:grid;
  grid-template-columns:92px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #e3e6ec;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  background:none;
  border-left:0;
  border-right:0;
  border-top:0;
  width:100%;
  text-align:left;
  font:inherit;
}

.previous-item:first-child{
  padding-top:8px;
}

.previous-item img{
  width:92px;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#eef1f5;
}

.previous-copy{
  min-width:0;
}

.previous-copy span{
  display:block;
  font-size:.84rem;
  line-height:1.38;
  font-weight:600;
  color:#344054;
}

.previous-item b{
  font-size:1.5rem;
  line-height:1;
  font-weight:400;
  color:#6f7484;
}

.previous-item:hover .previous-copy span{
  color:#2f6f9f;
}

.empty-state{
  border:1px dashed #c9ced8;
  padding:24px;
  color:#6f7484;
  background:#fff;
  font-size:.92rem;
}

.loading{
  color:#6f7484;
  font-size:.92rem;
}

/* Tablet */
@media(max-width:1050px){
  .page-grid{
    grid-template-columns:minmax(0, 1.75fr) minmax(280px, .85fr);
    gap:24px;
  }

  .latest-card{
    grid-template-columns:minmax(230px, 42%) minmax(0, 1fr);
    gap:22px;
    padding:16px;
  }

  .latest-copy h3{
    font-size:1.7rem;
  }

  .content-paragraphs p{
    font-size:.91rem;
  }
}

/* Small tablet */
@media(max-width:820px){
  .page-grid{
    grid-template-columns:1fr;
    gap:24px;
  }

  .previous-sidebar{
    order:2;
  }

  .previous-list{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    column-gap:20px;
  }

  .previous-item{
    grid-template-columns:78px minmax(0, 1fr) auto;
  }

  .previous-item img{
    width:78px;
  }
}

/* Mobile */
@media(max-width:620px){
  .page-grid{
    margin-top:22px;
  }

  .latest-card{
    grid-template-columns:1fr;
    gap:18px;
    padding:14px;
  }

  .latest-image{
    width:min(100%, 430px);
    margin:0 auto;
  }

  .latest-copy{
    font-size:.9rem;
  }

  .latest-copy time{
    font-size:.73rem;
    margin-bottom:6px;
  }

  .latest-copy h3{
    font-size:1.5rem;
    margin-bottom:10px;
  }

  .content-paragraphs p{
    font-size:.9rem;
    line-height:1.65;
    margin-bottom:13px;
  }

  .previous-sidebar{
    padding:16px;
  }

  .previous-list{
    display:flex;
  }

  .previous-item{
    grid-template-columns:76px minmax(0,1fr) auto;
    gap:10px;
    padding:10px 0;
  }

  .previous-item img{
    width:76px;
  }

  .previous-copy time{
    font-size:.7rem;
    margin-bottom:4px;
  }

  .previous-copy span{
    font-size:.82rem;
  }

  .previous-item b{
    font-size:1.3rem;
  }

  .read-more{
    padding:9px 13px;
    font-size:.68rem;
  }
}

@media(max-width:380px){
  .latest-card{
    padding:10px;
  }

  .latest-copy h3{
    font-size:1.35rem;
  }

  .content-paragraphs p{
    font-size:.86rem;
  }
}

</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="PTT NGR Main">
    <img class="logo" src="assets/PTT NGR color_0.png" alt="PTT NGR logo">
  </a>

  <div class="header-right">
    <img class="anniversary-logo" src="assets/PTT_40_years.png" alt="PTT 40 years NGR Natural Gas Retail">
    <div class="brand">
      <h1>PTT NGR</h1>
      <p>Knowledge &amp; Information Portal</p>
    </div>
  </div>
</header>

<nav class="nav" aria-label="Main navigation">
  <a href="index.html">MAIN</a>
  <a href="global-energy-prices.html">GLOBAL ENERGY PRICES</a>
  <a href="godji-content.html">GODJI CONTENT</a>
  <a href="other-news.html" class="active">OTHER NEWS</a>
</nav>

<main>
  <div class="eyebrow">SECTION</div>
  <h2>Other News</h2>
  <p class="intro">A dedicated page for other news and useful information.</p>

  <div class="page-grid">
    <section class="latest-content" aria-label="Latest content">
      <div id="latest-content" class="loading">Loading content…</div>
    </section>

    <aside class="previous-sidebar" aria-label="Previous Content">
      <h3>Previous Content</h3>
      <div id="previous-content" class="previous-list loading">Loading content…</div>
    </aside>
  </div>
</main>

<script>
const DATA_FILE = "assets/content/other-news.json";
let allItems = [];

function safeText(value) {
  return value == null ? "" : String(value);
}

function getParagraphs(item) {
  if (Array.isArray(item.paragraphs)) {
    return item.paragraphs
      .map(p => safeText(p).trim())
      .filter(Boolean);
  }

  return safeText(item.description)
    .split(/\n\s*\n/)
    .map(p => p.trim())
    .filter(Boolean);
}

function renderLatest(item) {
  const container = document.getElementById('latest-content');

  if (!item) {
    container.innerHTML = '<div class="empty-state">No content has been added yet.</div>';
    return;
  }

  const headline = safeText(item.headline).trim();
  const date = safeText(item.date).trim();
  const image = safeText(item.image).trim();
  const link = safeText(item.link).trim();
  const paragraphs = getParagraphs(item);

  const hasText = Boolean(headline || date || paragraphs.length || link);
  const card = document.createElement('article');
  card.className = 'latest-card' + (hasText ? '' : ' image-only');

  if (image) {
    const imageWrap = document.createElement('div');
    imageWrap.className = 'latest-image';

    const img = document.createElement('img');
    img.src = image;
    img.alt = headline || 'Content image';
    img.loading = 'eager';

    imageWrap.appendChild(img);
    card.appendChild(imageWrap);
  }

  if (hasText) {
    const copy = document.createElement('div');
    copy.className = 'latest-copy';

    if (date) {
      const time = document.createElement('time');
      time.dateTime = date;
      time.textContent = date;
      copy.appendChild(time);
    }

    if (headline) {
      const h3 = document.createElement('h3');
      h3.textContent = headline;
      copy.appendChild(h3);
    }

    if (paragraphs.length) {
      const paragraphsContainer = document.createElement('div');
      paragraphsContainer.className = 'content-paragraphs';

      paragraphs.forEach(paragraph => {
        const p = document.createElement('p');
        p.textContent = paragraph;
        paragraphsContainer.appendChild(p);
      });

      copy.appendChild(paragraphsContainer);
    }

    if (link) {
      const button = document.createElement('a');
      button.className = 'read-more';
      button.href = link;
      button.textContent = 'READ MORE →';

      if (/^https?:\/\//i.test(link)) {
        button.target = '_blank';
        button.rel = 'noopener noreferrer';
      }

      copy.appendChild(button);
    }

    card.appendChild(copy);
  }

  container.innerHTML = '';
  container.appendChild(card);
}

function renderPrevious(items) {
  const container = document.getElementById('previous-content');
  container.innerHTML = '';

  if (!items.length) {
    container.innerHTML = '<div class="empty-state">No previous content yet.</div>';
    return;
  }

  items.forEach(item => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'previous-item';

    const image = safeText(item.image).trim();
    const date = safeText(item.date).trim();
    const headline = safeText(item.headline).trim();

    if (image) {
      const img = document.createElement('img');
      img.src = image;
      img.alt = '';
      img.loading = 'lazy';
      button.appendChild(img);
    } else {
      const placeholder = document.createElement('div');
      placeholder.style.width = '92px';
      placeholder.style.aspectRatio = '1/1';
      placeholder.style.background = '#eef1f5';
      button.appendChild(placeholder);
    }

    const copy = document.createElement('div');
    copy.className = 'previous-copy';

    if (date) {
      const time = document.createElement('time');
      time.dateTime = date;
      time.textContent = date;
      copy.appendChild(time);
    }

    const title = document.createElement('span');
    title.textContent = headline || 'Untitled content';
    copy.appendChild(title);

    const arrow = document.createElement('b');
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '›';

    button.appendChild(copy);
    button.appendChild(arrow);

    button.addEventListener('click', () => {
      const currentId = item.id || item.date;
      window.location.hash = encodeURIComponent(currentId);
      renderLatest(item);
      renderPrevious(allItems.filter(other => (other.id || other.date) !== currentId));
      document.getElementById('latest-content').scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    });

    container.appendChild(button);
  });
}

async function loadContent() {
  try {
    const response = await fetch(DATA_FILE + '?v=' + Date.now());

    if (!response.ok) {
      throw new Error('Could not load ' + DATA_FILE);
    }

    const data = await response.json();
    allItems = Array.isArray(data.items) ? data.items : [];

    const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
    const selected = hash
      ? allItems.find(item => item.id === hash || item.date === hash)
      : allItems[0];

    const current = selected || allItems[0];
    renderLatest(current);

    const currentId = current ? (current.id || current.date) : '';
    renderPrevious(
      allItems.filter(item => (item.id || item.date) !== currentId)
    );
  } catch (error) {
    document.getElementById('latest-content').innerHTML =
      '<div class="empty-state">Content could not be loaded. Please check the JSON file path.</div>';
    document.getElementById('previous-content').innerHTML = '';
    console.error(error);
  }
}

window.addEventListener('hashchange', loadContent);
loadContent();
</script>
</body>
</html>
